[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-local"
version = "0.1.0"
description = "RAG com LangChain + LLMs locais (Ollama e Hugging Face) + Chroma"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
rag = "rag_local.cli:app"
rag-gui = "rag_local.gui:main"
